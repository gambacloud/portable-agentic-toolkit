name: Release

# Triggered by pushing a version tag: git tag v1.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  # ── Job 1: source ZIP + GitHub Release ──────────────────────────────────────
  create-release:
    name: Create release + source ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Build source archive
        run: |
          FILENAME="portable-agentic-toolkit-${VERSION}-source.zip"
          git archive --format=zip --prefix="portable-agentic-toolkit/" HEAD -o "$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1)
          RANGE="${PREV_TAG:+${PREV_TAG}..HEAD}"
          {
            echo "## Portable Agentic Toolkit ${VERSION}"
            echo ""
            echo "### Download"
            echo "| File | Description |"
            echo "|------|-------------|"
            echo "| \`PortableAgenticToolkit.exe\` | **Windows self-contained app** (no install needed) |"
            echo "| \`portable-agentic-toolkit-${VERSION}-source.zip\` | Source code + bootstrap scripts |"
            echo ""
            echo "### Windows EXE — quick start"
            echo '```'
            echo "1. Download PortableAgenticToolkit.exe"
            echo "2. Place it in an empty folder"
            echo "3. Double-click to run — opens at http://localhost:8002"
            echo '```'
            echo "> **Note:** Ollama must be installed separately for local models."
            echo "> Cloud models (Claude, Gemini, Groq) work without Ollama — just add API keys."
            echo ""
            echo "### Changes"
            git log ${RANGE:-HEAD} --pretty=format:"- %s" --no-merges
            echo ""
          } > release_notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$VERSION" \
            "$FILENAME" \
            --title "Portable Agentic Toolkit $VERSION" \
            --notes-file release_notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Windows EXE ──────────────────────────────────────────────────────
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Python dependencies + PyInstaller
        run: |
          uv sync --no-dev
          uv run pip install pyinstaller

      - name: Build EXE
        run: uv run pyinstaller build.spec --clean --noconfirm

      - name: Verify EXE exists
        run: |
          if (Test-Path "dist\PortableAgenticToolkit.exe") {
            $size = [math]::Round((Get-Item "dist\PortableAgenticToolkit.exe").Length / 1MB)
            Write-Host "EXE built: $size MB"
          } else {
            Write-Error "EXE not found!"
            exit 1
          }

      - name: Upload EXE to release
        run: gh release upload "$env:VERSION" "dist\PortableAgenticToolkit.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Publish release (after EXE is uploaded) ──────────────────────────
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-exe
    permissions:
      contents: write

    steps:
      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Publish draft release
        run: gh release edit "$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
