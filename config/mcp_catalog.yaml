# Known MCP servers the agent can install automatically.
# To add a custom server manually, drop a config.json into bin/mcp_servers/<name>/.

servers:
  fetch:
    package: "mcp-server-fetch"
    command: "uvx"
    description: "Fetch content from any URL — no API key needed"
    requires_confirmation: false
    env_vars: []

  duckduckgo:
    package: "duckduckgo-mcp-server"
    command: "uvx"
    description: "Web search via DuckDuckGo — no API key needed"
    requires_confirmation: false
    env_vars: []

  brave_search:
    package: "@modelcontextprotocol/server-brave-search"
    description: "Web search via Brave Search API"
    requires_confirmation: false
    env_vars:
      - key: BRAVE_API_KEY
        description: "Brave Search API key — get one free at https://api.search.brave.com"
        required: true

  slack:
    package: "@modelcontextprotocol/server-slack"
    description: "Post messages and read channels in Slack"
    requires_confirmation: true
    env_vars:
      - key: SLACK_BOT_TOKEN
        description: "Slack bot token (xoxb-...)"
        required: true
      - key: SLACK_TEAM_ID
        description: "Slack workspace team ID"
        required: true

  postgres:
    package: "@modelcontextprotocol/server-postgres"
    description: "Query a PostgreSQL database"
    requires_confirmation: true
    env_vars:
      - key: POSTGRES_URL
        description: "PostgreSQL connection URL (postgresql://user:pass@host/db)"
        required: true

  sqlite:
    package: "@modelcontextprotocol/server-sqlite"
    description: "Query a local SQLite database"
    requires_confirmation: true
    env_vars: []

  jira:
    package: "mcp-atlassian"
    command: "uvx"
    description: "Read and manage Jira issues, projects, and boards"
    requires_confirmation: true
    env_vars:
      - key: JIRA_URL
        description: "Jira instance URL (e.g. https://yourorg.atlassian.net)"
        required: true
      - key: JIRA_USERNAME
        description: "Atlassian account email"
        required: true
      - key: JIRA_API_TOKEN
        description: "Atlassian API token — create at https://id.atlassian.com/manage-profile/security/api-tokens"
        required: true

  github:
    package: "@modelcontextprotocol/server-github"
    command: "npx"
    description: "Read repos, issues, PRs, and code on GitHub"
    requires_confirmation: true
    env_vars:
      - key: GITHUB_TOKEN
        description: "GitHub personal access token (repo scope)"
        required: true

  gmail:
    package: "mcp-gmail"
    command: "uvx"
    description: "Read and send Gmail messages"
    requires_confirmation: true
    env_vars:
      - key: GMAIL_CREDENTIALS_FILE
        description: "Path to OAuth2 credentials JSON file from Google Cloud Console"
        required: true

  teams:
    package: "@floriscornel/teams-mcp"
    command: "npx"
    description: "Read and send Microsoft Teams messages via Microsoft Graph"
    requires_confirmation: true
    env_vars: []
    setup_note: >-
      One-time login required before this works: open a terminal and run
      `npx @floriscornel/teams-mcp@latest authenticate`, then sign in with your
      Microsoft account. No API key needed — the login token is cached locally.

  salesforce:
    package: "@tsmztech/mcp-server-salesforce"
    command: "npx"
    description: "Query and manage Salesforce records, objects, and Apex"
    requires_confirmation: true
    env_vars:
      - key: SALESFORCE_CONNECTION_TYPE
        description: "Auth method — use 'User_Password' for username/password/token login"
        required: true
      - key: SALESFORCE_USERNAME
        description: "Salesforce login username"
        required: true
      - key: SALESFORCE_PASSWORD
        description: "Salesforce login password"
        required: true
      - key: SALESFORCE_TOKEN
        description: "Salesforce security token (Settings → Reset My Security Token)"
        required: true
      - key: SALESFORCE_INSTANCE_URL
        description: "Org URL, e.g. https://yourorg.my.salesforce.com — leave blank for the default login.salesforce.com"
        required: false

  snowflake:
    package: "snowflake-labs-mcp"
    command: "uvx"
    description: "Query Snowflake data warehouses and Cortex AI services"
    requires_confirmation: true
    env_vars:
      - key: SNOWFLAKE_ACCOUNT
        description: "Snowflake account identifier (e.g. xy12345.us-east-1)"
        required: true
      - key: SNOWFLAKE_USER
        description: "Snowflake username"
        required: true
      - key: SNOWFLAKE_PASSWORD
        description: "Snowflake password or programmatic access token"
        required: true
      - key: SNOWFLAKE_WAREHOUSE
        description: "Warehouse to run queries on"
        required: false
      - key: SNOWFLAKE_ROLE
        description: "Role to connect as"
        required: false
    config_file:
      filename: "tools_config.yaml"
      cli_flag: "--service-config-file"
      default_content: |
        # Snowflake MCP tool/service permissions — review and edit before
        # installing. This controls which SQL operations and Cortex services
        # the agent is allowed to use. Exact keys are defined by the
        # snowflake-labs-mcp package — see https://github.com/Snowflake-Labs/mcp
        # for the current schema; this is a conservative read-only starting point.
        sql_permissions:
          select: true
          insert: false
          update: false
          delete: false
    setup_note: >-
      The default config only allows read-only SQL (SELECT). Edit the config
      file above before installing if you need write access — see
      https://github.com/Snowflake-Labs/mcp for the full config schema.
