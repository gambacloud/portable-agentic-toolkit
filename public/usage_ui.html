<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usage Dashboard</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
  }
  body {
    background: var(--bg-color);
    background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                      radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 2rem;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .container { max-width: 860px; margin: 0 auto; }
  h1 {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.1rem; }
  .glass-card {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .card-title .model-name { font-family: monospace; font-size: 1rem; }
  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: rgba(255,255,255,0.08);
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .bar-track {
    background: rgba(0,0,0,0.3);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin: 0.6rem 0 0.4rem;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  .bar-fill.warn { background: var(--warning); }
  .bar-fill.over { background: var(--danger); }
  .bar-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
  .section-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 2rem 0 1rem;
  }
  #loading { display: none; text-align: center; padding: 3rem; color: var(--text-muted); }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
    border-top-color: white; animation: spin 1s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .refresh-btn {
    border: none; background: rgba(255,255,255,0.06); color: var(--text-main);
    border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.1); }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Usage Dashboard</h1>
  <p class="subtitle">Token spend against the global budget and any per-model limits in <code>settings/model_limits.yaml</code>.</p>

  <div id="loading"><div class="spinner"></div> Loading usage…</div>

  <div class="section-title">Global budget</div>
  <div id="global-card"></div>

  <div class="section-title" style="display:flex; align-items:center; justify-content:space-between;">
    <span>Per-model limits</span>
    <button class="refresh-btn" onclick="loadUsage()">🔄 Refresh</button>
  </div>
  <div id="model-list"></div>
</div>

<script>
  const API = '';

  function pct(usage, limit) {
    if (!limit) return 0;
    return Math.min(100, Math.round((usage / limit) * 100));
  }

  function barClass(p) {
    if (p >= 100) return 'over';
    if (p >= 80) return 'warn';
    return '';
  }

  function renderBar(usage, limit) {
    const p = pct(usage, limit);
    return `
      <div class="bar-track"><div class="bar-fill ${barClass(p)}" style="width:${p}%"></div></div>
      <div class="bar-meta"><span>${usage.toLocaleString()} / ${limit.toLocaleString()} tokens</span><span>${p}%</span></div>
    `;
  }

  async function loadUsage() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('global-card').innerHTML = '';
    document.getElementById('model-list').innerHTML = '';
    try {
      const [budget, models] = await Promise.all([
        fetch(API + '/users/me/budget').then(r => r.json()),
        fetch(API + '/users/me/budget/models').then(r => r.json()),
      ]);
      document.getElementById('loading').style.display = 'none';

      document.getElementById('global-card').innerHTML = `
        <div class="glass-card">
          <div class="card-title"><span>🌐</span> All models combined</div>
          ${renderBar(budget.token_usage || 0, budget.token_limit || 0)}
        </div>
      `;

      const listEl = document.getElementById('model-list');
      if (!models.length) {
        listEl.innerHTML = '<div class="empty-state"><div class="icon">⚙️</div><p>No per-model limits configured. Add entries to <code>settings/model_limits.yaml</code> to cap specific models.</p></div>';
        return;
      }

      models.forEach(m => {
        const card = document.createElement('div');
        card.className = 'glass-card';
        card.innerHTML = `
          <div class="card-title">
            <span class="model-name">${esc(m.model)}</span>
            <span class="badge">${esc(m.period)}${m.period_key ? ' · ' + esc(m.period_key) : ''}</span>
          </div>
          ${renderBar(m.usage, m.limit)}
        `;
        listEl.appendChild(card);
      });
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('global-card').innerHTML = '<p style="color:var(--danger)">Failed to load usage data.</p>';
    }
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadUsage();
</script>
</body>
</html>
