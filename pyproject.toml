[project]
name = "portable-agentic-toolkit"
version = "1.3.0"
description = "Portable, privacy-first AI agent workspace powered by local LLMs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "mcp>=1.4.0",
    "ollama>=0.4.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "litellm>=1.50.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "openai>=1.0.0",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.1.1",
    "apscheduler>=3.11.2",
    "fpdf2>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "mcp_tools", "utils", "db", "api", "scheduler", "rag"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle + pyflakes + isort
ignore = [
    "E501",   # line length — handled by formatter
    "I001",   # import sort — enforced locally via `ruff check --fix`, not in CI
    "E402",   # module import not at top — main.py/api/server.py intentionally
              # import after setup code that must run first (env vars, mounts)
]

[tool.ruff.lint.isort]
known-first-party = ["agents", "mcp_tools", "utils"]
